{% extends 'includes/base.html' %}

{% block title %}Вход - ContentPlatform{% endblock %}

{% block content %}
<h2>Войти</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="p-2 btn btn-outline-primary" type="submit">Войти</button>
  <a class="p-2 btn btn-outline-secondary" href="{% url 'register' %}">Регистрация</a>
</form>

<!-- Восстановление пароля -->
<p class="mt-3">
  Забыли пароль? <a href="{% url 'password_reset' %}">Восстановить пароль</a>
</p>
{% endblock %}
