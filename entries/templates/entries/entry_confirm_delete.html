{% extends 'includes/base.html' %}

{% block title %}Удаление записи - ContentPlatform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Подтверждение удаления</div>
            <div class="card-body">
                <h5>Вы уверены, что хотите удалить запись?</h5>
                <p class="text-muted">"{{ entry.title }}"</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'entry-detail' entry.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
